[workspace]
members = [
  "application",
  "deribit-subscription",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.97"
async-trait = "0.1.88"
flume = "0.11.1"
futures-util = "0.3.31"
serde = {version = "1.0.219", features = ["derive"]}
serde_json = "1.0.140"
tokio = {version = "1.44.0", features = ["full"]}
tokio-util = {version = "0.7.13", features = ["rt"]}
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
