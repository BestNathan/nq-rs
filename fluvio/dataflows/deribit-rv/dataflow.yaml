apiVersion: 0.5.0
meta:
  name: deribit-rv
  version: 0.1.0
  namespace: deribit

config:
  converter: json
  consumer:
    default_starting_offset:
      value: 0
      position: End

types:
  time-and-vol:
    type: list
    items:
      type: f64
  response:
    type: object
    properties:
      result:
        type: list
        type-name: tv-list
        items:
          type: time-and-vol

topics:
  deribit-rv-btc:
    schema:
      value:
        type: response
  deribit-rv-eth:
    schema:
      value:
        type: response
  deribit-tdengine-http-sink:
    schema:
      value:
        type: string
        converter: raw

services:
  deribit-rv-btc:
    sources:
      - type: topic
        id: deribit-rv-btc

    transforms:
      - operator: flat-map
        run: |
          fn response_to_lines_btc(resp: Response) -> Result<Vec<String>> {
            let mut strs: Vec<String> = vec![];
            for row in resp.result {
                strs.push(format!(
                    "deribit_rv,index_name=BTC rv={} {}000000",
                    row.get(1).map(|f| f.to_string()).unwrap_or_default(),
                    row.get(0).map(|f| f.to_string()).unwrap_or_default(),
                ));
            }
            Ok(strs)
          }

    sinks:
      - type: topic
        id: deribit-tdengine-http-sink

  deribit-rv-eth:
    sources:
      - type: topic
        id: deribit-rv-eth

    transforms:
      - operator: flat-map
        run: |
          fn response_to_lines_eth(resp: Response) -> Result<Vec<String>> {
            let mut strs: Vec<String> = vec![];
            for row in resp.result {
                strs.push(format!(
                    "deribit_rv,index_name=ETH rv={} {}000000",
                    row.get(1).map(|f| f.to_string()).unwrap_or_default(),
                    row.get(0).map(|f| f.to_string()).unwrap_or_default(),
                ));
            }
            Ok(strs)
          }

    sinks:
      - type: topic
        id: deribit-tdengine-http-sink
