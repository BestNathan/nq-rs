apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nq-shared
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BestNathan/nq-rs.git
    targetRevision: main
    path: deploy/shared
  destination:
    server: https://kubernetes.default.svc
    namespace: nq
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
