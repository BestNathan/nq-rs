apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deribit-subscription
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BestNathan/nq-rs.git
    targetRevision: feat/deribit
    path: deploy/deribit-subscription
  destination:
    server: https://kubernetes.default.svc
    namespace: nq
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
