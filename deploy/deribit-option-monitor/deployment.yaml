apiVersion: apps/v1
kind: Deployment
metadata:
  name: deribit-option-monitor
  labels:
    app: deribit-option-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deribit-option-monitor
  template:
    metadata:
      labels:
        app: deribit-option-monitor
    spec:
      containers:
        - name: deribit-option-monitor
          image: bestnathan/nq-rs:deribit-option-monitor-latest
          envFrom:
            - configMapRef:
                name: nq-rs-config
            - secretRef:
                name: nq-rs-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
