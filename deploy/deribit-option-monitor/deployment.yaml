apiVersion: apps/v1
kind: Deployment
metadata:
  name: option-monitor
  labels:
    app: option-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: option-monitor
  template:
    metadata:
      labels:
        app: option-monitor
    spec:
      containers:
        - name: option-monitor
          image: ghcr.io/bestnathan/nq-rs/deribit-option-monitor:sha-7d9771a
          imagePullPolicy: Always
          env:
            - name: DEPLOY_ENV
              value: production
            - name: RUST_LOG
              value: info
            - name: EMQX_HOST
              value: emqx-prod-nodeport.emqx.svc.cluster.local
            - name: ALL_PROXY
              value: http://192.168.2.98:7891
            - name: HTTPS_PROXY
              value: http://192.168.2.98:7891
            - name: NO_PROXY
              value: .svc,.svc.cluster.local,localhost,127.0.0.1,10.0.0.0/8
            - name: no_proxy
              value: .svc,.svc.cluster.local,localhost,127.0.0.1,10.0.0.0/8
            - name: DERIBIT_OPTION_CURRENCIES
              value: BTC,ETH
            - name: DERIBIT_OPTION_TICKER_INTERVAL
              value: agg2
            - name: DERIBIT_OPTION_POOL_CAPACITY
              value: "2000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      imagePullSecrets:
        - name: ghcr-bestnathan
      nodeSelector:
        kubernetes.io/arch: amd64
