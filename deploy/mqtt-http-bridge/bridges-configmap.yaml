apiVersion: v1
kind: ConfigMap
metadata:
  name: mqtt-http-bridge-config
  namespace: nq
data:
  bridges.yaml: |
    # ── Production TDengine mirror via EMQX republish ──────────
    # Each config subscribes to t/bridge/deribit/<name> — flat JSON
    # republished by EMQX rule SQL output. No nested field parsing needed.

    bridges:

      # 1. Index Price (EMQX rule: deribit_index_price)
      - id: "deribit-index-price"
        mqtt_topics:
          - "t/bridge/deribit/index_price"
        http:
          url: "http://tdengine-prod-adapter.tdengine.svc.cluster.local:6041/influxdb/v1/write?db=deribit"
          method: POST
          headers:
            Authorization: "Basic cm9vdDp0YW9zZGF0YQ=="
        template: "${foreach}deribit_index_price,index_name=${payload.index_name} price=${payload.price} ${payload.timestamp}000000\n${end}"
        batch:
          size: 3000
          interval_ms: 500
          max_inflight: 4
          request_timeout_ms: 10000
        payload_parse: true

      # 2. Volatility Index (EMQX rule: deribit_volatility_index)
      - id: "deribit-volatility"
        mqtt_topics:
          - "t/bridge/deribit/volatility_index"
        http:
          url: "http://tdengine-prod-adapter.tdengine.svc.cluster.local:6041/influxdb/v1/write?db=deribit"
          method: POST
          headers:
            Authorization: "Basic cm9vdDp0YW9zZGF0YQ=="
        template: "${foreach}deribit_volatility_index,index_name=${payload.index_name} volatility=${payload.volatility} ${payload.timestamp}000000\n${end}"
        batch:
          size: 3000
          interval_ms: 500
          max_inflight: 4
          request_timeout_ms: 10000
        payload_parse: true

      # 3. Option Ticker (EMQX rule: option_ticker) — all 25 fields
      - id: "option-ticker"
        mqtt_topics:
          - "t/bridge/deribit/option_ticker"
        http:
          url: "http://tdengine-prod-adapter.tdengine.svc.cluster.local:6041/influxdb/v1/write?db=deribit"
          method: POST
          headers:
            Authorization: "Basic cm9vdDp0YW9zZGF0YQ=="
        template: "${foreach}option_ticker,index_name=${payload.index_name},expiry_date=${payload.expiry_date_str},strike_price=${payload.strike_price},type=${payload.type},instrument_name=${payload.instrument_name} best_bid_price=${payload.best_bid_price},best_ask_price=${payload.best_ask_price},last_price=${payload.last_price},mark_price=${payload.mark_price},mark_iv=${payload.mark_iv},bid_iv=${payload.bid_iv},ask_iv=${payload.ask_iv},best_bid_amount=${payload.best_bid_amount},best_ask_amount=${payload.best_ask_amount},open_interest=${payload.open_interest},index_price=${payload.index_price},underlying_price=${payload.underlying_price},delta=${payload.delta},gamma=${payload.gamma},theta=${payload.theta},vega=${payload.vega},rho=${payload.rho},settlement_price=${payload.settlement_price},state=\"${payload.state}\" ${payload.timestamp}000000\n${end}"
        batch:
          size: 3000
          interval_ms: 500
          max_inflight: 8
          request_timeout_ms: 10000
        payload_parse: true

      # 4. Options Markprice (EMQX rule: deribit_options) — FOREACH expanded
      - id: "deribit-options"
        mqtt_topics:
          - "t/bridge/deribit/options"
        http:
          url: "http://tdengine-prod-adapter.tdengine.svc.cluster.local:6041/influxdb/v1/write?db=deribit"
          method: POST
          headers:
            Authorization: "Basic cm9vdDp0YW9zZGF0YQ=="
        template: "${foreach}deribit_options,index_name=${payload.index_name},expiry_date=${payload.expiry_date_str},strike_price=${payload.strike_price},type=${payload.type},instrument_name=${payload.instrument_name} mark_price=${payload.mark_price},iv=${payload.iv} ${payload.timestamp}000000\n${end}"
        batch:
          size: 3000
          interval_ms: 500
          max_inflight: 8
          request_timeout_ms: 10000
        payload_parse: true
