apiVersion: v1
kind: ConfigMap
metadata:
  name: mqtt-http-bridge-config
  namespace: nq
data:
  bridges.yaml: |
    # MQTT → HTTP bridge configurations
    # Changes to this ConfigMap require a pod restart.
    bridges:
      # ── Deribit Index Price → TDengine dev ──────────────────────────
      # Subscribes to real Deribit topics (republished by EMQX per-channel).
      # Uses nested JSON field extraction for params.data.*
      - id: "deribit-index-price-dev"
        mqtt_topics:
          - "t/deribit/subscription/deribit_price_index.btc_usd"
          - "t/deribit/subscription/deribit_price_index.eth_usd"
        http:
          url: "http://tdengine-dev-adapter.tdengine.svc.cluster.local:6041/influxdb/v1/write?db=deribit_dev"
          method: POST
          headers:
            Authorization: "Basic cm9vdDp0YW9zZGF0YQ=="
        template: |
          deribit_index_price,index_name=${payload.params.data.index_name} price=${payload.params.data.price} ${payload.params.data.timestamp}000000
        batch:
          size: 1
          interval_ms: 1000
        payload_parse: true

      # ── Deribit Index Price Batch → TDengine dev ────────────────────
      # Batch version: accumulates and sends in bulk.
      # Template generates one line per item (newlines are literal in template)
      - id: "deribit-index-price-batch"
        mqtt_topics:
          - "t/deribit/subscription/deribit_price_index.btc_usd"
          - "t/deribit/subscription/deribit_price_index.eth_usd"
        http:
          url: "http://tdengine-dev-adapter.tdengine.svc.cluster.local:6041/influxdb/v1/write?db=deribit_dev"
          method: POST
          headers:
            Authorization: "Basic cm9vdDp0YW9zZGF0YQ=="
        template: |
          ${foreach
          }deribit_index_price,index_name=${payload.params.data.index_name} price=${payload.params.data.price} ${payload.params.data.timestamp}000000
          ${end}
        batch:
          size: 100
          interval_ms: 1000
          max_inflight: 4
          request_timeout_ms: 10000
        payload_parse: true
