name: cicd

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app:
          - deribit-subscription
          - deribit-option-monitor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.app }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP=${{ matrix.app }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-deploy-tags:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update image tags in deploy manifests
        id: update
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          APPS="deribit-subscription deribit-option-monitor"
          for app in $APPS; do
            FILE="deploy/${app}/deployment.yaml"
            if [ -f "$FILE" ]; then
              sed -i "s|\(image:.*/${app}\):sha-[a-f0-9]*|\1:sha-${SHA}|" "$FILE"
              echo "Updated $FILE"
              git diff "$FILE"
            fi
          done

      - name: Commit and push deploy tag update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/
          if git diff --cached --quiet; then
            echo "No deploy changes to commit"
          else
            git commit -m "deploy: update image tags to sha-${{ steps.update.outputs.sha }} [skip ci]"
            git push
          fi

  cleanup-old-images:
    needs: [build, update-deploy-tags]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    strategy:
      matrix:
        app:
          - deribit-subscription
          - deribit-option-monitor

    steps:
      - name: Delete old image versions (keep latest 5)
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ github.repository }}/${{ matrix.app }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          echo "=== Cleaning up old versions of ${PACKAGE_NAME} ==="

          # URL-encode the / in package name
          ENCODED=$(echo "${PACKAGE_NAME}" | sed 's|/|%2F|g')

          # List all non-latest versions, sorted by creation date (oldest first)
          VERSIONS=$(gh api \
            "orgs/${IMAGE_OWNER}/packages/container/${ENCODED}/versions?per_page=100" \
            --jq 'map(select(.metadata.container.tags | contains(["latest"]) | not))
                  | sort_by(.created_at)
                  | .[] | "\(.id) \(.metadata.container.tags | join(",")) \(.created_at)"')

          if [ -z "$VERSIONS" ]; then
            echo "No versions found"
            exit 0
          fi

          TOTAL=$(echo "$VERSIONS" | wc -l)
          KEEP=5
          DELETE=$((TOTAL - KEEP))

          if [ $DELETE -le 0 ]; then
            echo "Only ${TOTAL} versions, nothing to delete (keep ${KEEP})"
            exit 0
          fi

          echo "Found ${TOTAL} versions, will delete ${DELETE} oldest, keep ${KEEP}"

          echo "$VERSIONS" | head -n $DELETE | while read -r line; do
            ID=$(echo "$line" | awk '{print $1}')
            TAGS=$(echo "$line" | awk '{print $2}')
            echo "  Deleting version id=${ID} tags=${TAGS}"
            gh api --silent \
              -X DELETE \
              "orgs/${IMAGE_OWNER}/packages/container/${ENCODED}/versions/${ID}" \
              || echo "  Warning: failed to delete version ${ID}"
          done

          echo "=== Cleanup complete ==="
